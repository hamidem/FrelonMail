name: Package Windows

on:
  workflow_dispatch:
  pull_request:
    branches: [ "master", "dev" ]
    paths:
      - ".github/workflows/package-windows.yml"
      - ".github/scripts/create-draft-release.ps1"
      - ".github/scripts/create-windows-archive.ps1"
      - ".github/scripts/verify-windows-package.ps1"
      - "global.json"
      - "packaging/**"
      - "src/**"
      - "tests/Frelon.Cli.Tests/IsolatedEmailAnalysisProcessTests.cs"
  push:
    tags:
      - "v*"

concurrency:
  group: package-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.package_version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.301

      - name: Determine package version
        id: package_version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (& dotnet msbuild src/Frelon.Web/Frelon.Web.csproj `
            -getProperty:Version -nologo).Trim()
          if ($env:GITHUB_REF_TYPE -eq "tag" -and
              $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag '$env:GITHUB_REF_NAME' does not match project version '$version'."
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Unsupported package version: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Verify release tag belongs to master
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          git merge-base --is-ancestor $env:GITHUB_SHA origin/master

      - name: Restore and audit solution dependencies
        run: >-
          dotnet restore Frelon.slnx
          --locked-mode
          -p:NuGetAudit=true
          -p:NuGetAuditMode=all
          -p:NuGetAuditLevel=high
          -p:WarningsAsErrors=NU1903%3BNU1904

      - name: Restore Windows runtime
        run: dotnet restore src/Frelon.Web/Frelon.Web.csproj -r win-x64 --locked-mode

      - name: Restore Windows isolation tests
        run: dotnet restore tests/Frelon.Cli.Tests/Frelon.Cli.Tests.csproj --locked-mode

      - name: Verify Windows worker isolation
        run: >-
          dotnet test tests/Frelon.Cli.Tests/Frelon.Cli.Tests.csproj
          -c Release
          --no-restore
          --filter "Category=WindowsIsolation"
          --verbosity normal

      - name: Publish standalone application
        run: dotnet publish src/Frelon.Web/Frelon.Web.csproj -c Release --no-restore -p:PublishProfile=win-x64 -p:Version=${{ steps.package_version.outputs.version }} -o artifacts/Frelon-win-x64

      - name: Verify packaged analysis
        shell: pwsh
        run: >-
          ./.github/scripts/verify-windows-package.ps1
          -PackageDirectory artifacts/Frelon-win-x64
          -SamplePath samples/suspicious-demo.eml
          -ResultsDirectory artifacts/package-smoke

      - name: Upload package smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Frelon-package-smoke-diagnostics
          path: artifacts/package-smoke
          if-no-files-found: warn

      - name: Create portable archive
        shell: pwsh
        run: >-
          ./.github/scripts/create-windows-archive.ps1
          -PackageDirectory artifacts/Frelon-win-x64
          -Version "${{ steps.package_version.outputs.version }}"
          -OutputDirectory artifacts

      - name: Validate release assets
        shell: pwsh
        run: >-
          ./.github/scripts/create-draft-release.ps1
          -TagName "v${{ steps.package_version.outputs.version }}"
          -Version "${{ steps.package_version.outputs.version }}"
          -AssetDirectory artifacts
          -ValidateOnly

      - name: Upload portable archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Frelon-${{ steps.package_version.outputs.version }}-win-x64
          path: |
            artifacts/Frelon-${{ steps.package_version.outputs.version }}-win-x64.zip
            artifacts/Frelon-${{ steps.package_version.outputs.version }}-win-x64.zip.sha256
          if-no-files-found: error

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout release automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verified package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Frelon-${{ needs.package.outputs.version }}-win-x64
          path: artifacts/release

      - name: Create or update draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          ./.github/scripts/create-draft-release.ps1
          -TagName "${{ github.ref_name }}"
          -Version "${{ needs.package.outputs.version }}"
          -AssetDirectory artifacts/release
